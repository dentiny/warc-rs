[package]
name = "warc-rs"
version = "0.3.0"
description = "Async WARC reader/writer with OpenDAL storage (fork of the warc crate)."
readme = "README.md"
repository = "https://github.com/dentiny/warc-rs"
documentation = "https://docs.rs/warc-rs/"
license = "MIT"
authors = ["dentinyhao <dentinyhao@gmail.com>"]
categories = ["parser-implementations", "encoding"]
exclude = ["/target", "/.github"]
keywords = ["warc", "web", "archive"]
edition = "2018"

[dependencies]
chrono = "0.4.11"
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
nom = "8.0.0"
uuid = { version = "1.27.0", features = ["v4"] }

[dependencies.opendal]
optional = true
version = "0.59.3"
default-features = false
features = [
    "executors-tokio",
    "http-transport-reqwest",
    "layers-retry",
    "layers-timeout",
    "services-fs",
    "services-memory",
    "services-s3",
]

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dependencies.async-compression]
version = "0.4.50"
optional = true
default-features = false
features = ["futures-io", "gzip"]

[dependencies.libflate]
version = "2"
optional = true

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[features]
default = ["gzip", "storage"]
storage = ["dep:opendal"]
gzip = ["async-compression", "libflate"]
with_serde = ["serde"]

[[example]]
name = "read_filtered"
required-features = ["gzip", "storage"]

[[example]]
name = "read_gzip"
required-features = ["gzip", "storage"]

[[example]]
name = "write_gzip"
required-features = ["gzip", "storage"]

[[example]]
name = "read_file"
required-features = ["storage"]

[[example]]
name = "read_raw"
required-features = ["storage"]

[[example]]
name = "write_file"
required-features = ["storage"]

[[example]]
name = "write_raw"
required-features = ["storage"]

[[bench]]
name = "conversion"
harness = false

[package]
name = "warc"
version = "0.4.0"
description = "A Rust library for reading and writing WARC files."
readme = "README.md"
repository = "https://github.com/jedireza/warc"
documentation = "https://docs.rs/crate/warc/"
license = "MIT"
authors = ["Reza Akhavan <reza@akhavan.me>"]
keywords = ["warc", "web", "archive"]
edition = "2018"

[dependencies]
chrono = "0.4.11"
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
nom = "7.1.3"
uuid = { version = "0.8.1", features = ["v4"] }

[dependencies.opendal]
version = "0.58.2"
default-features = false
features = [
    "executors-tokio",
    "http-transport-reqwest",
    "layers-retry",
    "layers-timeout",
    "services-fs",
    "services-memory",
    "services-s3",
]

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dependencies.libflate]
version = "1"
optional = true

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[features]
default = ["gzip"]
gzip = ["libflate"]
with_serde = ["serde"]
